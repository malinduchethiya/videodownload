<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StreamScope — Video Inspector</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0c12;color:#f4f4f8;min-height:100vh;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,650px)}.brand{font-size:14px;letter-spacing:.15em;color:#aaa8ff;font-weight:800;margin-bottom:25px}.panel{background:#151722;border:1px solid #303244;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 24px 70px #0005}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.04em;margin:0 0 10px}p{color:#aaaebd;line-height:1.6}label{display:block;margin:28px 0 9px;font-weight:600;font-size:13px}input{width:100%;padding:16px;background:#0c0e16;color:white;border:1px solid #393c50;border-radius:12px;font-size:15px}button{width:100%;margin-top:14px;background:#a69bff;border:0;border-radius:12px;padding:16px;color:#111222;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.result{display:none;margin-top:24px;border-top:1px solid #353747;padding-top:20px}.result img{width:100%;border-radius:12px;max-height:300px;object-fit:cover}.meta{color:#c7c9d6;font-size:14px}.error{color:#ffaaaa}.foot{font-size:12px;margin-top:18px;text-align:center}
</style></head><body><main class="wrap"><div class="brand">STREAMSCOPE / YT-DLP</div><section class="panel"><h1>Inspect a video.</h1><p>Enter a public YouTube video URL to retrieve available metadata and stream information.</p><form id="form"><label for="url">VIDEO URL</label><input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"><button id="submit">Inspect video</button></form><div id="result" class="result" aria-live="polite"></div></section><p class="foot">For videos you own or are authorized to access. This demo inspects streams; it does not download files.</p></main><script>
const form=document.getElementById('form'),button=document.getElementById('submit'),result=document.getElementById('result');
function textNode(tag,value,cls){const el=document.createElement(tag);el.textContent=value||'';if(cls)el.className=cls;return el}
form.addEventListener('submit',async e=>{e.preventDefault();result.style.display='block';result.replaceChildren(textNode('p','Looking up video information…'));button.disabled=true;try{const r=await fetch('/api/info?url='+encodeURIComponent(document.getElementById('url').value));const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');result.replaceChildren();if(d.thumbnail){const img=document.createElement('img');img.src=d.thumbnail;img.alt='Video thumbnail';img.referrerPolicy='no-referrer';result.append(img)}result.append(textNode('h2',d.title||'Untitled'),textNode('p',`Channel: ${d.uploader||'Unknown'} · Duration: ${d.duration?Math.floor(d.duration/60)+'m '+d.duration%60+'s':'Unknown'}`,'meta'),textNode('p',`${d.formats.length} combined audio/video formats detected.`,'meta'));}catch(err){result.replaceChildren(textNode('p',err.message,'error'))}finally{button.disabled=false}});
</script></body></html>
