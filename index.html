
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border: 1px solid #333;
      border-radius: 20px;
      background: #1b1b22;
    }
    h1 { margin-top: 0; }
    p { color: #aaa; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      background: #101014;
      color: white;
      border: 1px solid #444;
      margin: 16px 0;
    }
    button {
      border: none;
      background: #8b5cf6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Video Downloader</h1>
    <p>Paste a YouTube URL to retrieve an available video stream.</p>
    <form id="form">
      <input id="url" type="url"
             placeholder="https://www.youtube.com/watch?v=..."
             required>
      <button type="submit">Get Video</button>
    </form>
    <p id="status"></p>
  </main>

  <script>
    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      const url = document.getElementById("url").value;
      document.getElementById("status").textContent =
        "Opening video stream...";
      window.location.href =
        "/api/download?url=" + encodeURIComponent(url);
    };
  </script>
</body>
</html>
